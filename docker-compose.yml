version: '3.8'

services:
  # ============================================
  # PostgreSQL 16
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: mushroom-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mushroom_farm
      POSTGRES_USER: mushroom
      POSTGRES_PASSWORD: mushroom_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mushroom -d mushroom_farm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Eclipse Mosquitto (MQTT Broker)
  # ============================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mushroom-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # ============================================
  # Mailhog (Dev SMTP server)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mushroom-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
